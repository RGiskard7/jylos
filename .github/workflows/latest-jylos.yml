name: Latest Jylos

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install headless UI test support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Compile and run tests
        run: xvfb-run -a mvn -B -f jylos/pom.xml clean test

      # Plugin sources are compiled against the app like third-party plugins, so the
      # Maven run above never sees them; this builds the plugin JARs and runs their tests
      # (Dataview, MCP, Publish, AI…). Some open JavaFX dialogs, hence xvfb.
      - name: Build and test plugins
        run: xvfb-run -a bash ./scripts/test-plugins.sh

  editor-web:
    name: Editor (CodeMirror) tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jylos/editor-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jylos/editor-web/package-lock.json

      - name: Install pinned dependencies
        run: npm ci

      - name: Run tests
        run: npm test
