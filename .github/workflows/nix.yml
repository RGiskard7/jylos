name: Nix package

# Builds the Nix flake (packaging/nix) whenever it changes, so a broken package is caught
# before anyone installs it. The runner is x86_64, the package's only system.
on:
  push:
    branches: [main]
    paths:
      - "packaging/nix/**"
      - ".github/workflows/nix.yml"
  pull_request:
    branches: [main]
    paths:
      - "packaging/nix/**"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the flake
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Check and build
        run: |
          nix flake check ./packaging/nix
          nix build ./packaging/nix#jylos --print-build-logs
          test -x result/bin/jylos
          test -f result/share/applications/jylos.desktop
          grep -q GDK_BACKEND result/bin/jylos
