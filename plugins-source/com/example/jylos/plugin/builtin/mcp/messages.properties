plugin.description=Exposes the vault to MCP clients (Claude Desktop, Claude Code, …) over a local HTTP server.
title=MCP Server
menu.connectionInfo=Connection info
command.connectionInfo.description=Shows the local URL MCP clients should connect to
command.restart.description=Stops and restarts the embedded MCP server
restart.ok.header=Restarted
restart.fail.header=Failed to restart
restart.ok.body=Listening at %s
restart.fail.body=Could not bind the server. Check the log for details.
running.header=Running
running.body=URL: %s\n\nAdd this as a Streamable HTTP / remote MCP server in your client (Claude Desktop, Claude Code, …). The vault is exposed read-mostly: notes, search and tags, plus creating notes and replacing a note's content. Deleting or trashing notes is not exposed.
notRunning.header=Not running
notRunning.body=The server failed to start. Check the log — a port already in use is the usual cause. Override it with -Djylos.mcp.port=<port> and restart Jylos, or use "MCP Server: Restart" from the command palette after freeing the port.
