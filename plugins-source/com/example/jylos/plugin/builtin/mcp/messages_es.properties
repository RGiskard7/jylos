plugin.description=Expone el vault a clientes MCP (Claude Desktop, Claude Code, …) mediante un servidor HTTP local.
title=Servidor MCP
menu.connectionInfo=Información de conexión
command.connectionInfo.description=Muestra la URL local a la que deben conectarse los clientes MCP
command.restart.description=Detiene y reinicia el servidor MCP embebido
restart.ok.header=Reiniciado
restart.fail.header=No se pudo reiniciar
restart.ok.body=Escuchando en %s
restart.fail.body=No se pudo enlazar el servidor. Consulta el log para más detalles.
running.header=En marcha
running.body=URL: %s\n\nAñade esto como servidor MCP remoto / Streamable HTTP en tu cliente (Claude Desktop, Claude Code, …). El vault se expone mayormente en modo lectura: notas, búsqueda y etiquetas, además de crear notas y reemplazar el contenido de una nota. Borrar o mover notas a la papelera no está expuesto.
notRunning.header=No está en marcha
notRunning.body=El servidor no pudo arrancar. Consulta el log — un puerto ya en uso es la causa habitual. Cámbialo con -Djylos.mcp.port=<puerto> y reinicia Jylos, o usa "MCP Server: Restart" desde la paleta de comandos tras liberar el puerto.
