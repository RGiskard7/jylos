# Publish plugin — default/English strings (see PluginI18n). Also the fallback if a
# translated bundle is missing a key. Keys are shared between PublishPlugin.java and
# PublishConfigDialog.java (same package, same bundle).

plugin.description=Export the vault as a static website (wiki-links, graph, ready for GitHub Pages/Vercel)
command.description=Export every note as a static HTML site with wiki-links and a graph, ready to publish
# Same value as the other built-in plugins' shared menuCategory.utilities key — kept
# duplicated here (not read from that shared bundle) since this is a different package/
# bundle, but must read identically so the Tools menu doesn't mix "Utilities" and
# "Utilidades" as if they were two different categories.
menuCategory.utilities=Utilities
menu.publishVault=Publish Vault as Static Site...
menu.publishNote=Publish this note...
chooser.title=Select Output Folder for the Published Site

alert.noSite.header=No Published Site Yet
alert.noSite.body=This updates an already-published site, but none has been published yet (or its folder is no longer there).\n\nRun "Publish Vault as Static Site..." once first (Tools menu, or the command palette) — after that, publishing a single note will update that same site.

confirm.notEmpty.header=Output folder is not empty
confirm.notEmpty.body=This folder already has files in it:\n%s\n\nJylos will add/overwrite the exported site's own files there, but won't delete anything else. Continue?

progress.vault.title=Publish Vault
progress.vault.header=Exporting notes...
progress.note.header=Updating the published site...

error.title=Publish Failed
error.vault.body=Could not export the vault: %s
error.note.body=Could not publish "%s": %s
error.unknown=unknown error

summary.note.title=Publish This Note
summary.note.header=Note Published
summary.note.body=\"%s\" is up to date at:%n%s%n%nPages refreshed: %d (this note plus its linked neighbours)

summary.vault.title=Publish Complete
summary.vault.header=Vault Published
summary.vault.body=Site exported to:%n%s%n%nNotes published: %d%nSkipped (private): %d%nSkipped (attachments): %d%nSkipped (errors): %d%nSkipped (not selected): %d
summary.vault.errorsNote=Some notes failed to export (e.g. invalid frontmatter) and were skipped — see the app log for which ones.

# PublishConfigDialog
dialog.title=Publish Vault as Static Site
dialog.header=Choose what to publish
button.publish=Publish
field.siteTitle.label=Site title
field.siteTitle.prompt=Jylos Vault
check.generateGraph=Generate the graph view (full page + each note's mini-graph)
label.includeHeading=Folders and notes to include:
field.search.prompt=Search notes…
toggle.tree=Folder tree
toggle.flat=All notes
button.expandAll=Expand all
button.collapseAll=Collapse all
button.selectAll=Select all
button.deselectAll=Deselect all
