# ---- Table of Contents ----
# generateToc()'s own inserted "## Table of Contents" heading is left untranslated on
# purpose: extractHeaders() skips a heading exactly equal to that text so regenerating a TOC
# doesn't re-list itself, and translating only one side of that comparison would break it.
