# Built-in plugins (Outline, Calendar, Daily Notes, Reading Time, Auto Backup, Templates,
# AI Assistant, Word Count, Table of Contents) — default/English strings (see PluginI18n).
# Also the fallback if a translated bundle is missing a key. All nine plugins live in the
# same package (com.example.jylos.plugin.builtin), so they share this one bundle — keys are
# prefixed per plugin (outline.*, calendar.*, dailynotes.*, readingtime.*, autobackup.*,
# templates.*, ai.*, wordcount.*, toc.*) to avoid collisions. A few menu categories repeat
# across plugins verbatim in English, so those share a single menuCategory.* key instead.

