# ---- Table of Contents ----
# generateToc()'s own inserted "## Table of Contents" heading is left untranslated on
# purpose: extractHeaders() skips a heading exactly equal to that text so regenerating a TOC
# doesn't re-list itself, and translating only one side of that comparison would break it.
toc.plugin.description=Generate table of contents from Markdown headers
toc.command.generate.description=Generate a table of contents from headers in the current note
toc.command.preview.description=Preview the table of contents without inserting
toc.command.numbered.description=Generate a numbered table of contents
toc.menu.generate=Generate TOC
toc.menu.preview=Preview TOC
toc.menu.numbered=Numbered TOC
toc.title=Table of Contents
