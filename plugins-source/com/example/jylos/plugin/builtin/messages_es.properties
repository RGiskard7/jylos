# ---- Table of Contents ----
# El encabezado "## Table of Contents" que inserta generateToc() se deja deliberadamente sin
# traducir: extractHeaders() omite un encabezado si coincide exactamente con ese texto, para
# que al regenerar el índice no se liste a sí mismo — traducir solo un lado de esa
# comparación lo rompería.
