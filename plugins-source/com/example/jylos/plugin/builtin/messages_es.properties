# Plugins integrados (Outline, Calendar, Daily Notes, Reading Time, Auto Backup, Templates,
# AI Assistant, Word Count, Table of Contents) — cadenas en español (ver PluginI18n). Los
# nueve plugins viven en el mismo paquete (com.example.jylos.plugin.builtin), así que
# comparten este único bundle — las claves llevan prefijo por plugin (outline.*, calendar.*,
# dailynotes.*, readingtime.*, autobackup.*, templates.*, ai.*, wordcount.*, toc.*) para
# evitar colisiones. Algunas categorías de menú se repiten igual en inglés entre plugins, así
# que esas comparten una única clave menuCategory.*.

# Categorías de menú compartidas
# "Core" se deja sin traducir a propósito: es el nombre de la categoría tal y como el
# usuario la conoce; "Básico" no aportaba nada y confundía.
menuCategory.core=Core
menuCategory.productivity=Productividad
menuCategory.utilities=Utilidades

