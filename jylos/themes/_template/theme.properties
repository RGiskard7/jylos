# External theme descriptor — copy this folder, rename it and edit these values.
# id must be unique; it is what gets stored in preferences when selected.
id=my-theme
name=My Theme
css=theme.css
# darkLike=true  → dark Markdown preview + dark-aware dialogs.
darkLike=false
# base=dark|light|system|auto — stack built-in theme.css under yours (recommended).
# base=auto
# Shown on the website (optional): who made it, and a line in English and Spanish.
# Write non-ASCII characters as \uXXXX escapes (Java reads this file as ISO-8859-1).
# author=Your Name
# description=One line about the theme.
# description.es=Una l\u00ednea sobre el tema.
